<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Split the Bill</title>
  <meta name="description" content="Snap a receipt, let friends claim what they had, and get paid back with PayPal.">

  <!-- Installable web app: home-screen icon, full screen, no browser bar. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Split">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">

  <script>
    // Set the theme before first paint so there's no flash. Light is the default; the top-bar button switches.
    // The browser bar matches the top bar (--card) of the chosen theme.
    try { document.documentElement.dataset.theme = localStorage.getItem("theme") === "dark" ? "dark" : "light"; } catch { document.documentElement.dataset.theme = "light"; }
    document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.theme === "dark" ? "#151d33" : "#ffffff";
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="/" aria-label="SPLIT">
      <span class="logo" aria-hidden="true"><span class="logo-top">SPLIT</span><span class="logo-bottom">SPLIT</span></span>
    </a>
    <button type="button" class="icon-btn right-2" id="theme-toggle" aria-label="Switch to dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <a class="icon-btn right" href="/?login" aria-label="Log in or view profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    </a>
  </header>
  <main id="app" aria-live="polite">
    <p class="muted">Loading…</p>
  </main>
  <p id="toast" role="status" hidden></p>
  <dialog id="qr-dialog">
    <div class="stack" style="justify-items:center; text-align:center">
      <h2>Scan to join</h2>
      <div id="qr"></div>
      <p class="small muted">Friends point their phone camera at this code.</p>
      <form method="dialog"><button class="primary">Done</button></form>
    </div>
  </dialog>

  <!-- app.js loads the PayPal SDK itself, using the URL for the environment set on the server. -->
  <script type="module" src="/app.js"></script>
  <script>
    const toggle = document.getElementById("theme-toggle");
    const label = () => toggle.setAttribute("aria-label", document.documentElement.dataset.theme === "dark" ? "Switch to light mode" : "Switch to dark mode");
    label();
    toggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      const apply = () => {
        document.documentElement.dataset.theme = next;
        document.querySelector('meta[name="theme-color"]').content = next === "dark" ? "#151d33" : "#ffffff";
        try { localStorage.setItem("theme", next); } catch { /* private mode */ }
        label();
      };
      // One cross-fade of the whole page (see ::view-transition in style.css). Without it, every color
      // would transition on its own clock and the switch would smear. Browsers without the API just swap.
      if (document.startViewTransition) document.startViewTransition(apply);
      else apply();
    });
  </script>
</body>
</html>
